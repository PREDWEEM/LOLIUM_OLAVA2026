name: Calcular métricas de validación

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "calcular_metricas_validacion.py"
      - "pages/2_Validacion.py"
      - "app_emergenciacombinado.py"
      - "meteo_daily.csv"
      - "VALIDA (1).xlsx"
      - "IW.npy"
      - "bias_IW.npy"
      - "LW.npy"
      - "bias_out.npy"
      - "modelo_clusters_k3.pkl"
      - ".github/workflows/calcular_metricas_validacion.yml"
  push:
    branches:
      - main
    paths:
      - "calcular_metricas_validacion.py"
      - "pages/2_Validacion.py"
      - "app_emergenciacombinado.py"
      - "meteo_daily.csv"
      - "VALIDA (1).xlsx"
      - "IW.npy"
      - "bias_IW.npy"
      - "LW.npy"
      - "bias_out.npy"
      - "modelo_clusters_k3.pkl"
      - ".github/workflows/calcular_metricas_validacion.yml"

permissions:
  contents: write

concurrency:
  group: metricas-validacion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calcular:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validar sintaxis de scripts
        run: |
          python -m py_compile calcular_metricas_validacion.py
          python -m py_compile pages/2_Validacion.py

      - name: Calcular métricas locales
        run: python calcular_metricas_validacion.py

      - name: Mostrar resumen generado
        run: |
          echo "--- metricas_olavarria.csv ---"
          cat resultados_validacion/metricas_olavarria.csv

      - name: Verificar delta diario del primer pico
        run: |
          python - <<'PY'
          import pandas as pd

          ruta = "resultados_validacion/metricas_olavarria.csv"
          datos = pd.read_csv(ruta)

          requeridas = [
              "Fecha_primer_pico_observado",
              "Fecha_primer_pico_simulado",
              "Delta_primer_pico_dias",
              "Fecha_primer_pico_simulado_intervalo",
              "Delta_primer_pico_intervalo_dias",
              "Metodo_delta_primer_pico",
          ]
          faltantes = [
              columna
              for columna in requeridas
              if columna not in datos.columns
          ]
          if faltantes:
              raise SystemExit(
                  "Faltan columnas: " + ", ".join(faltantes)
              )

          observado = pd.to_datetime(
              datos.loc[0, "Fecha_primer_pico_observado"],
              errors="coerce",
          )
          simulado_diario = pd.to_datetime(
              datos.loc[0, "Fecha_primer_pico_simulado"],
              errors="coerce",
          )
          delta_guardado = int(
              datos.loc[0, "Delta_primer_pico_dias"]
          )
          delta_esperado_olavarria = -4

          if pd.isna(observado) or pd.isna(simulado_diario):
              raise SystemExit(
                  "No se pudieron determinar las fechas del primer pico."
              )

          delta_recalculado = (
              simulado_diario - observado
          ).days

          print(
              "Pico observado:",
              observado.date(),
          )
          print(
              "Pico diario simulado:",
              simulado_diario.date(),
          )
          print(
              "Delta guardado:",
              delta_guardado,
              "días",
          )
          print(
              "Delta recalculado:",
              delta_recalculado,
              "días",
          )
          print(
              "Delta esperado para Olavarría:",
              delta_esperado_olavarria,
              "días",
          )

          if delta_guardado != delta_recalculado:
              raise SystemExit(
                  "Delta diario inconsistente con las fechas: "
                  f"{delta_guardado}; se recalculó {delta_recalculado}."
              )

          if delta_guardado != delta_esperado_olavarria:
              raise SystemExit(
                  "Delta diario incorrecto para Olavarría: "
                  f"{delta_guardado}; se esperaba "
                  f"{delta_esperado_olavarria}."
              )

          metodo = str(
              datos.loc[0, "Metodo_delta_primer_pico"]
          )
          if "diario" not in metodo.lower():
              raise SystemExit(
                  "El método no declara resolución diaria."
              )
          PY

      - name: Guardar resultados actualizados
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resultados_validacion/
          if git diff --cached --quiet; then
            echo "Las métricas no cambiaron."
            exit 0
          fi
          git commit -m "Actualiza métricas de validación de Olavarría"
          git pull --rebase origin main
          git push origin HEAD:main
