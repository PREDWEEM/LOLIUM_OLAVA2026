name: Calcular métricas de validación

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "calcular_metricas_validacion.py"
      - "app_emergenciacombinado.py"
      - "meteo_daily.csv"
      - "VALIDA (1).xlsx"
      - "IW.npy"
      - "bias_IW.npy"
      - "LW.npy"
      - "bias_out.npy"
      - "modelo_clusters_k3.pkl"
      - ".github/workflows/calcular_metricas_validacion.yml"
  push:
    branches:
      - main
    paths:
      - "calcular_metricas_validacion.py"
      - "app_emergenciacombinado.py"
      - "meteo_daily.csv"
      - "VALIDA (1).xlsx"
      - "IW.npy"
      - "bias_IW.npy"
      - "LW.npy"
      - "bias_out.npy"
      - "modelo_clusters_k3.pkl"
      - ".github/workflows/calcular_metricas_validacion.yml"

permissions:
  contents: write

concurrency:
  group: metricas-validacion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calcular:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Calcular métricas locales
        run: python calcular_metricas_validacion.py

      - name: Mostrar resumen generado
        run: |
          echo "--- metricas_olavarria.csv ---"
          cat resultados_validacion/metricas_olavarria.csv

      - name: Guardar resultados actualizados
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resultados_validacion/
          if git diff --cached --quiet; then
            echo "Las métricas no cambiaron."
            exit 0
          fi
          git commit -m "Actualiza métricas de validación de Olavarría"
          git pull --rebase origin main
          git push origin HEAD:main
