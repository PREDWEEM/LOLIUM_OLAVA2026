name: Actualizar Datos Meteorológicos

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *'

permissions:
  contents: write

jobs:
  actualizar-datos:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests

      - name: Ejecutar script de descarga
        run: python descargar_clima_olavarria.py

      - name: Hacer commit y push de los cambios
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add meteo_daily_olava_real.csv
          if git diff --cached --quiet; then
            echo "No hay cambios para guardar."
          else
            git commit -m "Actualización automática de datos meteorológicos"
            git push
          fi
